# ====================================================================
# PhotoStyle Docker Compose 部署
#
# 两种使用方式：
#   方式 A（默认）：只容器化应用，连接宿主机已有的 MySQL/Redis/MinIO
#   方式 B（全量） ：取消注释下方 mysql/redis/minio 服务，全部容器化
#
# 使用前：
#   1. cp .env.docker.example .env.docker
#   2. 修改 .env.docker 中的密码、API Key
#   3. docker compose up -d --build
# ====================================================================

services:
  # ---------- 后端 ----------
  backend:
    build: ./server
    container_name: photostyle-backend
    restart: always
    env_file:
      - .env.docker
    environment:
      # 通过宿主机访问已部署的 MySQL/Redis/MinIO
      - DB_HOST=host.docker.internal
      - REDIS_HOST=host.docker.internal
      - MINIO_ENDPOINT=host.docker.internal:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7823:7823"

  # ---------- 前端 + Nginx ----------
  web:
    build: ./web
    container_name: photostyle-web
    restart: always
    depends_on:
      - backend
    ports:
      - "7821:80"

  # ====================================================================
  # 方式 B：全量容器化（取消注释即可使用）
