# ====================================================================
# Alembic 数据库迁移配置
#
# 数据库连接串由 alembic/env.py 从应用配置(settings.database)动态注入，
# 此处仅保留 Alembic 框架所需的最小配置项。
# ====================================================================

[alembic]
# 脚本目录（相对于本配置文件所在目录）
script_location = alembic

# 迁移文件命名模板
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# 时区
timezone = UTC

# 输出时间戳格式
truncate_slug_length = 40

# Python 路径前缀（便于迁移脚本导入应用包）
prepend_sys_path = .

# 模板使用的语言
# output_encoding = utf-8

# sqlalchemy.url 留空：由 env.py 从 settings.database.url 注入
sqlalchemy.url =


[post_write_hooks]
# 迁移脚本生成后的后处理钩子（按需启用）


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
